name: write-manual
description: |
  通用"写 manual"编排配方。
  输入一个 source（代码/文本/图片/PDF，任意可读形式）+ 一个 format reference（目标手册的格式规范，
  文本/PDF/图片示例），编排 4 个 subagent：
    A scan-source      只读，从 source 提取全部可复用内容（API/结构/流程/术语/示例）
    B output-reference 只读，提炼 reference 的写作规范（TOC 骨架/单章模板/API 文档写法）
    C compose-manual   写文件，整合 A+B 结果，按 B 的格式规范生成符合 source 设计的手册
    D end-check        独立审查 agent，分别核对"是否符合 source 设计"+"是否符合 B 的格式规范"，
                       输出问题清单；若有问题则回到 C 修订再 review。
  适用：HAL/驱动代码 → 用户手册；Verilog/VHDL RTL → 模块手册；Python/Java 代码 → API 文档；
  设计草稿 → 正式说明书。

model: claude-sonnet
extensions:
  - name: shell
  - name: analyze
  - name: read_image
  - name: autovisualiser

max_turns: 60

parameters:
  source:
    type: string
    description: source 文件/目录路径（代码、文本、图片、PDF 均支持）
    default: ""
  reference:
    type: string
    description: 格式参考（PDF/图片/文本路径；可为多路径用逗号分隔）
    default: ""
  output:
    type: string
    description: 生成的 manual 文件路径（.md）
    default: ""
  language:
    type: string
    description: 手册正文语言（如 中/英/中英混排）
    default: "中英混排"
  exclude_existing_manual:
    type: boolean
    description: 排除 source 目录里已存在的旧成品手册（防事实污染）。设为 false 则以旧手册为 source 之一做增量升级
    default: true

instructions: |
  你是主协调 agent。sub_recipes 按列表顺序执行，每个 subagent 的输出
  自动累积进后续 subagent 的上下文（无需显式传参）：

    scan-source      （只读）→ 提取 source 事实清单
    output-reference （只读）→ 提炼 reference 格式规范
    compose-manual   （写文件）→ 整合前两者，按规范生成 {{ output }}
    end-check        （独立审查）→ 分别核对事实层 + 格式层，输出问题清单

  运行前把 parameters 渲染好：
  - Source 路径：{{ source }}
  - Reference 路径：{{ reference }}（可能是 PDF/图片/文本，用 pdftotext / read_image / shell 读）
  - 输出路径：{{ output }}
  - 正文语言：{{ language }}
  - 排除旧手册：{{ exclude_existing_manual }}（透传给 scan-source 的 exclude_existing_manual）

  传给 sub_recipes：
  - scan-source：source + output + exclude_existing_manual={{ exclude_existing_manual }}
  - output-reference：reference
  - compose-manual：source + reference + output + language
  - end-check：source + reference + output

  最后汇总 end-check 的结论。若 end-check 报 NEEDS_FIX，回到 compose-manual
  修订后再跑一次 end-check（最多 3 轮，避免死循环）。

sub_recipes:
  - scan-source
  - output-reference
  - compose-manual
  - end-check
