name: compose-manual
description: 写文件 subagent——整合 scan-source 与 output-reference 结果，按规范生成手册

model: claude-sonnet
extensions:
  - name: shell
  - name: write
  - name: edit
  - name: read_image

max_turns: 80
parameters:
  source:
    type: string
    description: source 路径（供查源码核实 API 名）
  reference:
    type: string
    description: 格式参考路径
  output:
    type: string
    description: 要写入的 manual 文件路径（.md）
  language:
    type: string
    description: 手册正文语言

instructions: |
  你是写作 agent，唯一允许的写操作：{{ output }}（及它的同目录 .context/）。

  前置上下文（由前两个 subagent 累积，已在你的上下文里）：
  - scan-source 报告：source 的真实 API / struct / 枚举清单
  - output-reference 报告：写作规范 / 单章模板 / 术语映射 / 写作原则

  **第 0 步（先判断模式）：{{ output }} 是否已存在旧手册**
  - 若文件不存在 → 【重写模式】：从零按模板写整篇
  - 若文件已存在 → 【修订模式】：**只做增量修订，不要整篇重写覆盖**。
    修订模式规则：
    1. 修订前先备份可回滚：`cp {{ output }} {{ output }}.bak-$(date +%Y%m%d%H%M)`
       （若 source 目录是 git 仓库，额外跑 `git status {{ output }}` 确认基线）
    2. 先 `read` 现有 {{ output }}，保留其既有章节结构、术语映射、示例风格
    3. 用 scan-source 报告逐章 diff：只改「与 source 事实不符」的地方，
       只补「source 有但手册缺」的 API/字段，只删「source 已不存在」的过时描述
    4. 用 output-reference 报告核对格式：格式不符处按规范调整，但不动已正确的章节
    5. 用 `edit`（精确替换）而不是 `write`（整文件覆盖）做修改，保留 git 可 diff
    6. 在手册末尾 Revision history 表加一行：`<日期> 修订，列出改了哪些章节`
    7. 修订完报告「改动的章节列表 + 新增/删除的 API 数 + 备份文件路径」，而非总行数
       （若 D 后续发现大错需整体回滚，用 `.bak` 文件恢复）

  任务：按 output-reference 的模板，整合 scan-source 的事实，写出 {{ output }}（或按上面修订模式改它）。

  执行步骤（重写模式）：
  1. 先确认两个前置报告都在上下文里；缺失则停止并报错
  2. 按 reference 的 TOC 骨架搭章节（顶级 + 次级）
  3. 每章按单章模板（N.1 features → N.2 config structs → N.3 handle → N.4 how to use → N.5 API description）
  4. 每个 API 用 reference 规定的文档格式（五段式/表格/代码块，以 reference 为准）
  5. 每章补 1-2 段可运行示例代码（用 source 真实 API 名，字段名逐一对齐源码头文件）
  6. 通用层章节（Introduction / Acronyms / General information / Overview / Conventions / Revision history）
  7. 术语映射表放 Introduction 后
  8. 写完后 shell `wc -l {{ output }}` 确认行数

  强制要求：
  - 所有 API/struct/枚举名必须与 source 原文一致，禁止编造
  - 正文语言：{{ language }}（API/struct 名保持 source 原样）
  - 每章 N.5 至少写 3 个 API（若 source 该模块不足 3 个，说明原因）
  - 修订模式：用 `edit` 精确替换，禁止整文件 `write` 覆盖；保留已有内容
  - 写完后报告：总行数 + 各章起始行号（重写）或 改动章节列表（修订）

  可选：把 A/B 的原始报告也留档到 {{ output }}.context/，便于 D 复核
